info:
  name: Login
  type: http
  seq: 7

http:
  method: GET
  url: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const cookies = res.getHeader('set-cookie');

        if(cookies) {
          bru.setVar("cookie", cookies.join('; '));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
