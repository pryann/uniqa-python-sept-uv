info:
  name: Create post
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/posts"
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "title": "title",
        "body": "text"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
